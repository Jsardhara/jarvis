[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal-assistant multi-agent system on Claude Code"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "msal>=1.28",
    "caldav>=1.3",
    "claude-agent-sdk>=0.1.68",
    "sqlalchemy>=2.0",
    "pymupdf>=1.24",
    "anthropic>=0.25",
    "sentence-transformers>=2.7,<3",
    "feedparser>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]
daemon = [
    "claude-agent-sdk>=0.1",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]
voice = [
    # Free stack (Phase 5.1 + 5.2)
    "edge-tts>=6.1",            # free Microsoft Neural TTS, no API key
    "faster-whisper>=1.0",      # CTranslate2-optimized whisper, ~4x faster on CPU
    "openwakeword>=0.6",        # free 'Hey Jarvis' pretrained wake word
    "sounddevice>=0.4",         # mic + speaker I/O
    "soundfile>=0.12",          # MP3/WAV decode for play_audio
    "numpy>=1.24",              # audio array handling + energy VAD
    # Optional fallbacks (operator may install if needed)
    "pvporcupine>=3.0",         # paid wake-word alternative
    "openai-whisper>=20231117", # legacy whisper fallback
]
links = [
    # URL ingestion + multimodal pipeline
    "yt-dlp>=2024.10",          # download YouTube/Insta/TikTok/X video + audio
    "imageio-ffmpeg>=0.5",      # ships ffmpeg binary as wheel (no system install)
    "pillow>=10.0",             # keyframe resize / PNG encode
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --tb=short"

[tool.coverage.run]
source = ["jarvis"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B", "E402", "SIM117", "I001", "E741"]
"jarvis/apps/api/app.py" = ["ARG001", "N806", "B008"]
"jarvis/apps/sentinel/routines.py" = ["ARG001"]
"jarvis/apps/sentinel/scheduler.py" = ["ARG001", "SIM105"]
"jarvis/apps/voice/wake.py" = ["SIM110"]
"jarvis/apps/voice/stt.py" = ["ARG002"]
"jarvis/core/supervisor.py" = ["N818"]
